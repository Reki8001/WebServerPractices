<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Presupuesto recibido</title>
</head>
<body>

<h1>Presupuesto recibido correctamente</h1>

<p>Unidades: <span th:text="${unidades}"></span></p>
<p>Precio por unidad:<span th:text="${precio}"></span>€</p>

<p>Montaje: <span th:text="${montaje}"></span></p>

<a th:href="@{/presupuesto_form}">Volver al formulario</a>

</body>
</html>
