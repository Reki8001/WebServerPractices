<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de presupuesto</title>
</head>
<body>

<h1>Calcular presupuesto</h1>

<form th:action="@{/presupuesto}" method="get">

    <label for="producto">Producto:</label>
    <input type="text" id="producto" name="producto" required>

    <br><br>

    <label for="unidades">Unidades:</label>
    <input type="number" id="unidades" name="unidades"
           value="1" min="1" max="100" required>

    <br><br>

    <label for="precio">Precio por unidad (€):</label>
    <input type="number" id="precio" name="precio"
           step="0.01" min="0" required>

    <br><br>

    <label for="cliente">Tipo de cliente:</label>
    <select id="cliente" name="cliente">
        <option value="particular">Particular</option>
        <option value="club">Club</option>
    </select>

    <br><br>

    <input type="checkbox" id="montaje" name="montaje" value="true">
    <label for="montaje">Incluir montaje</label>

    <br><br>

    <button type="submit">Calcular presupuesto</button>

</form>

</body>
</html>
