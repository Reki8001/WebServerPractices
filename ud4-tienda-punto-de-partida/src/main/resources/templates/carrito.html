<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Carrito · Bit a Bit</title>
</head>
<body>

<h1>Tu carrito</h1>

<div>
    <h3 th:text="'Sumatorio total en este carrito: ' + ${sumatorio}"></h3>
</div>

<p th:if="${#lists.isEmpty(carrito)}">Tu carrito está vacío</p>

<table th:unless="${#lists.isEmpty(carrito)}">
    <tr>
        <th>#</th>
        <th>Artículo / Pedido</th>
    </tr>
    <tr th:each="i, e : ${carrito}">
        <td th:text="${e.count}">0</td>
        <td th:text="${i}">Ejemplo</td>
    </tr>
</table>

<p th:text="'Número de artículos: ' + ${total}">Artículos: 0</p>

<div>
    <form action="/carrito/vaciar" method="post">
        <button type="submit">Vaciar carrito</button>
    </form>

    <a href="/catalogo"><button type="button">Ir al catálogo</button></a>
    <a href="/pedido"><button type="button">Hacer otro pedido</button></a>
</div>

</body>
</html>
