<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Carrito · Bit a Bit</title>
</head>
<body>

<h1>Tu carrito</h1>

<p th:if="${#lists.isEmpty(carrito)}">Tu carrito está vacío</p>

<table th:unless="${#lists.isEmpty(carrito)}" border="1">
    <tr>
        <th>#</th>
        <th>Artículo</th>
    </tr>
    <tr th:each="item, e : ${carrito}">
        <td th:text="${e.count}">0</td>
        <td th:text="${item}">Ejemplo</td>
    </tr>
</table>

<p th:text="'Artículos: ' + ${total}">Artículos: 0</p>

<div style="margin-top: 20px;">
    <form action="/carrito/vaciar" method="post" style="display:inline;">
        <button type="submit">Vaciar carrito</button>
    </form>

    <a href="/catalogo"><button type="button">Ir al catálogo</button></a>
</div>

</body>
</html>
